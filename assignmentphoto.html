<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ajay{
              width: 100vw;
            height: 100vh;
        }
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero {
            width: 100vw;
            height: 100vh;

            background-image: url("your-image.jpg");
            background-size: cover;
            background-position: center;

            position: relative;
        }

        .varunsir {
            position: absolute;
            inset: 0;

            display: grid;

           
            grid-template-columns: 1fr 1fr 1fr;

           
            grid-template-rows: 1fr 1fr 1fr;

            padding: 30px;

            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        
        .varunsir div:nth-child(3n + 1) {
            text-align: left;
        }

        
        .varunsir div:nth-child(3n + 2) {
            text-align: center;
        }

        
        .varunsir div:nth-child(3n) {
            text-align: right;
        }

       
        .varunsir div:nth-child(-n + 3) {
            align-self: start;
        }

      
        .varunsir div:nth-child(n + 4):nth-child(-n + 6) {
            align-self: center;
        }

        
        .varunsir div:nth-child(n + 7) {
            align-self: end;}
     
    </style>
</head>
<body>
      <div class="varunsir">
        <div>ajay yadav</div>
        <div>ajay yadav</div>
        <div>ajay yadav</div>

        <div>ajay yadav</div>
        <div>ajay yadav</div>
        <div>ajay yadav</div>

        <div>ajay yadav</div>
        <div>ajay yadav</div>
        <div>ajay yadav</div>
    </div>
 <img class="ajay" src="IMG_3680.jpeg" alt="">
</body>
</html>
