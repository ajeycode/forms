<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding spacing and the margin</title>
    <style>
        .box{
            background-color: skyblue;
        }
        *{
            padding: 0%;
          }
          .box1{
            color: red;
            padding: 10px;
            margin: 25px;
            border: 5px salmon;
            height: 200px;
            box-sizing: border-box;
          }
          .box2{
            color: yellow;
            color: red;
            padding: 10px;
            margin: 25px;
            border: 5px black ;
            height: 200px;
            box-sizing: border-box;
          }
    </style>
</head>
<body>
    <div class="box box1">
        Im a box model
    </div>
    <div class="box box2"> Im another box</div>
</body>
</html>
